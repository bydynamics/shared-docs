<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 560" font-family="Segoe UI,Arial,sans-serif">
<rect width="1560" height="560" fill="#0d1117"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#8b98a5"/></marker></defs>
<text x="780.0" y="34" fill="#e6e6e6" font-size="17" font-weight="700" text-anchor="middle">EIP workflow delivery — build once · settings before deploy · gated promotion (GitHub Actions)</text>
<rect x="40" y="90" width="270" height="190" rx="8" fill="#161d27" stroke="#4c8bf5" stroke-width="2"/>
<text x="175.0" y="114" fill="#4c8bf5" font-size="13" font-weight="700" text-anchor="middle">CI — pull request → main</text>
<text x="54" y="134" fill="#e6e6e6" font-size="10.5">trigger: PR + merge to main</text>
<text x="54" y="150" fill="#e6e6e6" font-size="10.5">• JSON-validate all workflow.json</text>
<text x="54" y="166" fill="#e6e6e6" font-size="10.5">• LogicAppUnit tests</text>
<text x="54" y="182" fill="#e6e6e6" font-size="10.5">   (connectors mocked, local runtime)</text>
<text x="54" y="198" fill="#e6e6e6" font-size="10.5">• zip project → publish artifact</text>
<text x="54" y="214" fill="#e6e6e6" font-size="10.5">   30 workflows + host.json</text>
<text x="54" y="230" fill="#e6e6e6" font-size="10.5">   + parameterized connections.json</text>
<rect x="360" y="130" width="200" height="110" rx="8" fill="#161d27" stroke="#e8890c" stroke-width="2"/>
<text x="460.0" y="154" fill="#e8890c" font-size="13" font-weight="700" text-anchor="middle">Immutable artifact</text>
<text x="374" y="174" fill="#e6e6e6" font-size="10.5">eip-workflows.zip</text>
<text x="374" y="190" fill="#e6e6e6" font-size="10.5">built ONCE</text>
<text x="374" y="206" fill="#e6e6e6" font-size="10.5">same zip → every stage</text>
<rect x="620" y="90" width="270" height="190" rx="8" fill="#161d27" stroke="#3fbf5f" stroke-width="2"/>
<text x="755.0" y="114" fill="#3fbf5f" font-size="13" font-weight="700" text-anchor="middle">CD — TEST</text>
<text x="634" y="134" fill="#e6e6e6" font-size="10.5">1. GitHub env: test (vars/secrets)</text>
<text x="634" y="150" fill="#e6e6e6" font-size="10.5">2. apply app settings</text>
<text x="634" y="166" fill="#e6e6e6" font-size="10.5">    FlowState enable/disable</text>
<text x="634" y="182" fill="#e6e6e6" font-size="10.5">    parameter values</text>
<text x="634" y="198" fill="#e6e6e6" font-size="10.5">3. zip deploy (azure/functions-action)</text>
<rect x="703.25" y="76" width="104" height="22" rx="11" fill="#3fbf5f"/>
<text x="755.0" y="91" fill="#10151c" font-size="11" font-weight="700" text-anchor="middle">automatic</text>
<rect x="930" y="90" width="270" height="190" rx="8" fill="#161d27" stroke="#e0a83e" stroke-width="2"/>
<text x="1065.0" y="114" fill="#e0a83e" font-size="13" font-weight="700" text-anchor="middle">CD — ACC</text>
<text x="944" y="134" fill="#e6e6e6" font-size="10.5">1. GitHub env: acc (vars/secrets)</text>
<text x="944" y="150" fill="#e6e6e6" font-size="10.5">2. apply app settings</text>
<text x="944" y="166" fill="#e6e6e6" font-size="10.5">    FlowState enable/disable</text>
<text x="944" y="182" fill="#e6e6e6" font-size="10.5">    parameter values</text>
<text x="944" y="198" fill="#e6e6e6" font-size="10.5">3. zip deploy (azure/functions-action)</text>
<rect x="970.5" y="76" width="189" height="22" rx="11" fill="#e0a83e"/>
<text x="1065.0" y="91" fill="#10151c" font-size="11" font-weight="700" text-anchor="middle">required reviewers</text>
<rect x="1240" y="90" width="270" height="190" rx="8" fill="#161d27" stroke="#c05cd6" stroke-width="2"/>
<text x="1375.0" y="114" fill="#c05cd6" font-size="13" font-weight="700" text-anchor="middle">CD — PROD</text>
<text x="1254" y="134" fill="#e6e6e6" font-size="10.5">1. GitHub env: prod (vars/secrets)</text>
<text x="1254" y="150" fill="#e6e6e6" font-size="10.5">2. apply app settings</text>
<text x="1254" y="166" fill="#e6e6e6" font-size="10.5">    FlowState enable/disable</text>
<text x="1254" y="182" fill="#e6e6e6" font-size="10.5">    parameter values</text>
<text x="1254" y="198" fill="#e6e6e6" font-size="10.5">3. zip deploy (azure/functions-action)</text>
<rect x="1280.5" y="76" width="189" height="22" rx="11" fill="#c05cd6"/>
<text x="1375.0" y="91" fill="#10151c" font-size="11" font-weight="700" text-anchor="middle">required reviewers</text>
<line x1="310" y1="185.0" x2="360" y2="185.0" stroke="#8b98a5" stroke-width="2" marker-end="url(#ar)"/>
<text x="335.0" y="177.0" fill="#9fb0c0" font-size="10" text-anchor="middle">build</text>
<line x1="560" y1="185.0" x2="620" y2="185.0" stroke="#8b98a5" stroke-width="2" marker-end="url(#ar)"/>
<text x="590.0" y="177.0" fill="#9fb0c0" font-size="10" text-anchor="middle">release</text>
<line x1="890" y1="185.0" x2="930" y2="185.0" stroke="#8b98a5" stroke-width="2" marker-end="url(#ar)"/>
<text x="910.0" y="177.0" fill="#9fb0c0" font-size="10" text-anchor="middle">promote</text>
<line x1="1200" y1="185.0" x2="1240" y2="185.0" stroke="#8b98a5" stroke-width="2" marker-end="url(#ar)"/>
<text x="1220.0" y="177.0" fill="#9fb0c0" font-size="10" text-anchor="middle">promote</text>
<rect x="40" y="340" width="430" height="130" rx="8" fill="#161d27" stroke="#9fb0c0" stroke-width="2"/>
<text x="255.0" y="364" fill="#9fb0c0" font-size="13" font-weight="700" text-anchor="middle">Per-environment configuration (no code changes)</text>
<text x="54" y="384" fill="#e6e6e6" font-size="10.5">GitHub Environments: test / acc / prod</text>
<text x="54" y="400" fill="#e6e6e6" font-size="10.5">• endpoints via parameters.json / @appsetting(...)</text>
<text x="54" y="416" fill="#e6e6e6" font-size="10.5">• EnableWorkflowList / DisableWorkflowList</text>
<text x="54" y="432" fill="#e6e6e6" font-size="10.5">   → Workflows.&lt;name&gt;.FlowState</text>
<text x="54" y="448" fill="#e6e6e6" font-size="10.5">• experiment workflows pinned Disabled in ACC/PROD</text>
<rect x="510" y="340" width="430" height="130" rx="8" fill="#161d27" stroke="#9fb0c0" stroke-width="2"/>
<text x="725.0" y="364" fill="#9fb0c0" font-size="13" font-weight="700" text-anchor="middle">Rules</text>
<text x="524" y="384" fill="#e6e6e6" font-size="10.5">• app settings applied BEFORE zip deploy</text>
<text x="524" y="400" fill="#e6e6e6" font-size="10.5">   (triggers never start on stale config)</text>
<text x="524" y="416" fill="#e6e6e6" font-size="10.5">• portal/designer edits are overwritten — repo only</text>
<text x="524" y="432" fill="#e6e6e6" font-size="10.5">• auth: OIDC federated credentials per environment</text>
<text x="524" y="448" fill="#e6e6e6" font-size="10.5">• Kudu sync disconnected · connections = infra pipeline</text>
<rect x="980" y="340" width="530" height="130" rx="8" fill="#161d27" stroke="#9fb0c0" stroke-width="2"/>
<text x="1245.0" y="364" fill="#9fb0c0" font-size="13" font-weight="700" text-anchor="middle">Rollback &amp; environments</text>
<text x="994" y="384" fill="#e6e6e6" font-size="10.5">rollback = redeploy previous artifact (one step)</text>
<text x="994" y="400" fill="#e6e6e6" font-size="10.5">TEST  → logic-ivgroep-eip-test</text>
<text x="994" y="416" fill="#e6e6e6" font-size="10.5">ACC   → logic-ivgroep-eip-acc</text>
<text x="994" y="432" fill="#e6e6e6" font-size="10.5">PROD → logic-ivgroep-eip-prod   (30 workflows)</text>
</svg>